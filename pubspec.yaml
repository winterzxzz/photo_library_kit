name: photo_library_kit
description: "Fast, ergonomic access to the device photo & video library: paged queries, cancellable cached thumbnails, live change streams. Android & iOS."
version: 0.1.0
topics:
  - photos
  - gallery
  - media
  - image-picker
  - video

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.winterzxzz.photo_library_kit
        pluginClass: PhotoLibraryKitPlugin
      ios:
        pluginClass: PhotoLibraryKitPlugin
