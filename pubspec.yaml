name: photo_library_kit
description: "Fast, ergonomic access to the device photo & video library: paged queries, cancellable cached thumbnails, live change streams. Android & iOS."
version: 0.1.0
repository: https://github.com/winterzxzz/photo_library_kit
issue_tracker: https://github.com/winterzxzz/photo_library_kit/issues
topics:
  - photos
  - gallery
  - media
  - image-picker
  - video

screenshots:
  - description: WeChat-style multi image picker with numbered selection
    path: doc/images/wechat-picker.webp
  - description: Instagram-style photo picker with square crop preview
    path: doc/images/instagram-picker.webp
  - description: Album list with cover thumbnails and counts
    path: doc/images/wechat-albums.webp
  - description: Full-screen swipe preview with zoom
    path: doc/images/wechat-preview.webp
  - description: Photo and video gallery grid with filters
    path: doc/images/api-gallery.webp
  - description: Asset metadata and file access
    path: doc/images/asset-details.webp

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.winterzxzz.photo_library_kit
        pluginClass: PhotoLibraryKitPlugin
      ios:
        pluginClass: PhotoLibraryKitPlugin
